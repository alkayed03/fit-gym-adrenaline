<style>
/* ==========================================================
   FIT GYM ADRENALINE — QR card
   Tokens
   ========================================================== */
:root {
  --bg: #050506;
  --surface: #101013;
  --surface-2: #17181c;
  --line: #232327;

  --red: #e3141b;
  --red-dim: #8c0f13;
  --red-glow: rgba(227, 20, 27, 0.35);

  --white: #f5f4f2;
  --muted: #9a9aa1;
  --muted-dim: #6b6b72;

  --font-display: "Big Shoulders Display", sans-serif;
  --font-body: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;

  --cut: 16px; /* angular corner cut, echoes the X mark in the logo */
  --radius: 4px;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  background: var(--bg);
  color: var(--white);
  font-family: var(--font-body);
  -webkit-font-smoothing: antialiased;
}

body {
  min-height: 100dvh;
}

@media (prefers-reduced-motion: reduce) {
  * { animation-duration: 0.001ms !important; transition-duration: 0.001ms !important; }
}

/* ==========================================================
   Stage — keeps the card at phone width even on desktop
   ========================================================== */
.stage {
  min-height: 100dvh;
  width: 100%;
  display: flex;
  justify-content: center;
  align-items: flex-start;
  padding: 0;
  background:
    radial-gradient(60% 40% at 50% 0%, rgba(227,20,27,0.10), transparent 70%),
    var(--bg);
}

.card {
  width: 100%;
  max-width: 430px;
  min-height: 100dvh;
  background: var(--bg);
  position: relative;
  padding: 40px 22px 28px;
  border-left: 1px solid var(--line);
  border-right: 1px solid var(--line);
}

@media (min-width: 431px) {
  .stage { padding: 32px 16px; }
  .card {
    min-height: auto;
    border: 1px solid var(--line);
    border-radius: 18px;
    box-shadow: 0 40px 80px -30px rgba(0,0,0,0.8);
    overflow: hidden;
    padding-bottom: 24px;
  }
}

/* ==========================================================
   Hero
   ========================================================== */
.hero {
  position: relative;
  text-align: center;
  padding-top: 4px;
  margin-bottom: 28px;
}

.hero-glow {
  position: absolute;
  top: -60px;
  left: 50%;
  transform: translateX(-50%);
  width: 320px;
  height: 220px;
  background: radial-gradient(circle, var(--red-glow) 0%, transparent 70%);
  pointer-events: none;
  z-index: 0;
}

.logo {
  position: relative;
  z-index: 1;
  width: 100%;
  max-width: 300px;
  display: block;
  margin: 0 auto;
}

.tagline {
  position: relative;
  z-index: 1;
  margin: 6px 0 0;
  font-family: var(--font-display);
  font-weight: 700;
  font-size: 20px;
  letter-spacing: 0.04em;
  color: var(--muted);
  text-transform: uppercase;
}

/* ==========================================================
   Buttons — shared
   ========================================================== */
.btn {
  display: flex;
  align-items: center;
  gap: 14px;
  width: 100%;
  border: none;
  cursor: pointer;
  text-decoration: none;
  font-family: var(--font-body);
  color: var(--white);
  transition: transform 120ms ease, filter 120ms ease;
}

.btn:active { transform: scale(0.98); }
.btn:focus-visible { outline: 2px solid var(--white); outline-offset: 3px; }

/* ---------- Primary: WhatsApp + Directions ---------- */
.primary-actions {
  display: flex;
  flex-direction: column;
  gap: 12px;
  margin-bottom: 18px;
}

.btn-primary {
  padding: 16px 18px;
  background: var(--surface);
  border: 1px solid var(--line);
  clip-path: polygon(0 0, 100% 0, 100% calc(100% - var(--cut)), calc(100% - var(--cut)) 100%, 0 100%);
  position: relative;
}

.btn-primary::before {
  content: "";
  position: absolute;
  left: 0; top: 0; bottom: 0;
  width: 4px;
  background: var(--red);
}

.btn-primary .btn-icon {
  flex: 0 0 auto;
  width: 46px;
  height: 46px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  background: var(--red);
  color: var(--white);
}

.btn-primary .btn-label {
  display: flex;
  flex-direction: column;
  gap: 2px;
  text-align: left;
}

.btn-primary strong {
  font-family: var(--font-display);
  font-weight: 700;
  font-size: 18px;
  letter-spacing: 0.01em;
  line-height: 1.1;
}

.btn-primary small {
  color: var(--muted);
  font-size: 13px;
}

.btn-primary:active { filter: brightness(1.08); }

/* ---------- Secondary: Call / Share ---------- */
.secondary-actions {
  display: flex;
  gap: 10px;
  margin-bottom: 26px;
}

.btn-outline {
  flex: 1 1 0;
  justify-content: center;
  padding: 12px 10px;
  background: transparent;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  font-size: 14px;
  font-weight: 600;
}

.btn-outline:active { background: var(--surface-2); }

/* ---------- Instagram + Facebook side by side ---------- */
.social-row {
  display: flex;
  gap: 10px;
}

.btn-social {
  flex: 1 1 0;
  width: auto;
  gap: 8px;
}

/* ---------- Social ---------- */
.social {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 14px 4px;
  border-top: 1px solid var(--line);
  border-bottom: 1px solid var(--line);
  margin-bottom: 26px;
}

.social-label {
  font-size: 13px;
  color: var(--muted-dim);
  font-weight: 500;
}

.social-icons {
  display: flex;
  gap: 10px;
}

.icon-btn {
  width: 38px;
  height: 38px;
  border-radius: 50%;
  border: 1px solid var(--line);
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--white);
  text-decoration: none;
  transition: border-color 120ms ease, transform 120ms ease;
}

.icon-btn:active { transform: scale(0.94); border-color: var(--red); }

/* ==========================================================
   Hours
   ========================================================== */
.hours { margin-bottom: 30px; }

.hours h2 {
  font-family: var(--font-display);
  font-size: 17px;
  font-weight: 700;
  letter-spacing: 0.02em;
  text-transform: uppercase;
  margin: 0 0 12px;
  color: var(--white);
}

.hours ul {
  list-style: none;
  margin: 0;
  padding: 0;
}

.hours li {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  padding: 11px 0;
  border-top: 1px solid var(--line);
}

.hours li:first-child { border-top: none; }

.hours .group {
  font-weight: 600;
  font-size: 15px;
}

.hours .time {
  font-size: 14px;
  color: var(--muted);
  font-variant-numeric: tabular-nums;
}

/* ==========================================================
   Footer
   ========================================================== */
.footer {
  text-align: center;
  padding-top: 6px;
}

.footer p {
  margin: 0;
  font-size: 12px;
  letter-spacing: 0.03em;
  color: var(--muted-dim);
}

/* ==========================================================
   Toast (share fallback)
   ========================================================== */
.toast {
  position: fixed;
  left: 50%;
  bottom: 28px;
  transform: translate(-50%, 12px);
  background: var(--surface-2);
  border: 1px solid var(--line);
  color: var(--white);
  padding: 10px 16px;
  border-radius: 8px;
  font-size: 13px;
  opacity: 0;
  pointer-events: none;
  transition: opacity 180ms ease, transform 180ms ease;
  z-index: 10;
}

.toast.show {
  opacity: 1;
  transform: translate(-50%, 0);
}

</style>
</head>

      time.textContent = row.time;

      li.appendChild(time);

    });

  // ---- Share button (Web Share API, with clipboard fallback) ----
  var shareBtn = document.getElementById("share-btn");
  if (shareBtn) {
    shareBtn.addEventListener("click", function () {
      var url = cfg.shareUrl && cfg.shareUrl.length ? cfg.shareUrl : window.location.href;
      var shareData = {
        title: cfg.shareTitle || cfg.name || document.title,
        text: cfg.shareText || "",
        url: url,
      };

      if (navigator.share) {
        navigator.share(shareData).catch(function () {
          /* user cancelled — no action needed */
        });
        return;
      }

      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard
          .writeText(url)
          .then(function () {
            showToast("Link copied to clipboard");
          })
          .catch(function () {
            showToast(url);
          });
      } else {
        showToast(url);
      }
    });
  }
})();

</script>
</body>
</html>
